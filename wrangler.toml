name = "s3"
compatibility_date = "2024-01-01"

# Cloudflare Pages Assets Configuration
# This allows wrangler deploy to work with static assets
[assets]
directory = "./dist"

# Cloudflare Pages Functions for SPA routing
# This ensures all routes serve index.html for React Router
[[redirects]]
from = "/*"
to = "/index.html"
status = 200

