apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: s3-browser-ingress
  namespace: default
  annotations:
    # Use annotations for your specific Ingress controller, e.g., nginx.ingress.kubernetes.io/rewrite-target: /
spec:
  rules:
  - http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: s3-browser-service
            port:
              number: 80
